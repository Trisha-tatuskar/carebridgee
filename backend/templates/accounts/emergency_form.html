{% extends "accounts/base.html" %}
{% load static %}

{% block title %}Report Emergency - CareBridge{% endblock %}

{% block content %}
<section class="cb-page-header cb-page-header-emergency">
    <h2>Report an Emergency</h2>
    <p>Emergency works even without login. Please provide accurate details.</p>
</section>

<section class="cb-form-section">
    <div class="cb-form-card">
        <form method="post" id="emergencyForm" class="cb-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="cb-btn cb-btn-primary cb-form-btn">
                Submit Emergency Report
            </button>
        </form>
    </div>
</section>
{% endblock %}

{% extends "accounts/base.html" %}
{% load static %}

{% block title %}Volunteer Registration - CareBridge{% endblock %}

{% block content %}
<section class="cb-page-header">
    <h2>Volunteer Registration</h2>
    <p>Sign up once to help in deliveries, rescue response and on-ground support.</p>
</section>

<section class="cb-form-section">
    <div class="cb-form-card">
        <form method="post" id="volunteerForm" class="cb-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="cb-btn cb-btn-primary cb-form-btn">
                Submit Volunteer Details
            </button>
        </form>
    </div>
</section>
{% endblock %}
